[project]
name = "econ726-notebooks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tara-sullivan", email = "tasulliv@ucsd.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "causalinference>=0.1.3",
    "folium>=0.20.0",
    "geopandas>=1.1.4",
    "linearmodels>=7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "polars>=1.44.2",
    "pysyncon>=1.7.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "sodapy>=2.2.0",
    "statsforecast>=2.0.1",
    "statsmodels>=0.15.0",
    "tabulate>=0.10.0",
]

[project.scripts]
econ726-notebooks = "econ726_notebooks:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
